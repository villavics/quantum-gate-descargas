name: Publicar Quantum Gate web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Descargar y verificar la entrega web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download web-2026.10.20-r3 --repo villavics/quantum-gate-descargas --pattern Quantum_Gate_GitHub_2026-10-20.zip
          echo '7e2a00065e32ba9b685f622464dba8fbe0e4b34063bee092674ab10187528c84  Quantum_Gate_GitHub_2026-10-20.zip' | sha256sum --check
          unzip -q Quantum_Gate_GitHub_2026-10-20.zip
          mv Quantum_Gate_GitHub_2026-10-20 _site
          cd _site
          sha256sum --check SHA256SUMS.txt
          test -s index.html
          test -s index.pck
          test -s index.wasm
          test -s index.service.worker.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
